name: pbi-driven
version: 1
artifacts:
  - id: specs
    generates: "specs/**/*.md"
    description: Behavioral specifications
    template: spec.md
    instruction: Write observable behavior only.
    requires: []
  - id: tasks
    generates: tasks.md
    description: Orchestration delegation
    template: tasks.md
    instruction: Write one orchestration task.
    requires: [specs]
apply:
  requires: [tasks]
  tracks: tasks.md