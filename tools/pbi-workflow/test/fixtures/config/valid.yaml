version: 1
trusted:
  pbiAuthors:
    - product-owner
  approvers:
    - engineering-lead
verification:
  install:
    enabled: true
    command: npm ci
  format:
    enabled: false
    reason: This repository has no standalone format check
  lint:
    enabled: true
    command: npm run lint
  typecheck:
    enabled: true
    command: npm run build
  test:
    enabled: true
    command: npm test
  build:
    enabled: true
    command: npm run build
demo:
  start:
    enabled: false
    reason: This package has no interactive application